apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-rl-sa
  namespace: openrl-system
  annotations:
    iam.gke.io/gcp-service-account: openrl-worker-gsa@gca-gke-test.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-rl-worker-manager
  namespace: openrl-system
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-rl-worker-manager-binding
  namespace: openrl-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: open-rl-worker-manager
subjects:
  - kind: ServiceAccount
    name: open-rl-sa
    namespace: openrl-system
